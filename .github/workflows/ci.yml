name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run test:unit
      # Headless jsdom suites that exercise the client fixes (hamburger menu,
      # cross-tab sync, scrollback) and the B1 mouse wiring — no kilo needed.
      - run: npm run test:b1
      - run: npm run test:client-e2e
